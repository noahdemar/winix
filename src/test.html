<!DOCTYPE html>
<meta charset="utf-8">
<title>winix smoke</title>
<pre id="out"></pre>
<script type="module">
import { Winix } from './winix.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };
const results = (window.__results = { cases: [], timings: {} });
const eq = (a, b, what) => {
  if (a !== b) throw new Error(`${what ?? 'value'}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
};
const med = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];

const t0 = performance.now();
let w;
try {
  w = await Winix.boot({ onLog: (t) => console.log(t) });
} catch (e) {
  results.bootError = String(e.message || e);
  window.__done = true;
  throw e;
}
results.timings.coldBootMs = performance.now(); // page load -> boot() resolved
results.timings.coldBootFromBootCallMs = performance.now() - t0;
log('booted');

const cases = [
  ['1 echo hi', async () => {
    const r = await w.exec('echo hi');
    eq(r.stdout, 'hi\n'); eq(r.stderr, ''); eq(r.exitCode, 0);
  }],
  ['2 stderr + exit 3', async () => {
    const r = await w.exec('echo err >&2; exit 3');
    eq(r.stderr, 'err\n'); eq(r.exitCode, 3); eq(r.stdout, '');
  }],
  ['3 multiline quoting/heredoc/unicode', async () => {
    const script = `v=world
echo 'single $v' "double $v"
cat <<EOF2
heredoc $v
héllo ✓
EOF2
echo "it's"`;
    const r = await w.exec(script);
    eq(r.stdout, `single $v double world\nheredoc world\nhéllo ✓\nit's\n`); eq(r.exitCode, 0);
  }],
  ['4 cwd/env', async () => {
    const r = await w.exec('pwd; echo $FOO', { cwd: '/tmp', env: { FOO: `it's "x"` } });
    eq(r.stdout, `/tmp\nit's "x"\n`);
    eq((await w.exec('pwd')).stdout, '/work\n');
  }],
  ['5 fs persists, shell vars do not', async () => {
    await w.exec('X=1');
    eq((await w.exec('echo ${X:-unset}')).stdout, 'unset\n');
    await w.exec('echo a > f');
    eq((await w.exec('cat f')).stdout, 'a\n');
  }],
  ['6 writeFile/readFile', async () => {
    const text = 'héllo ✓ wörld\n日本語';
    await w.writeFile('/work/t.txt', text);
    eq(await w.readFile('/work/t.txt', { encoding: 'utf8' }), text);
    const bin = new Uint8Array(1024);
    for (let i = 0; i < 1024; i++) bin[i] = i & 255;
    await w.writeFile('/work/a/b/c.bin', bin);
    const back = await w.readFile('/work/a/b/c.bin');
    eq(back.length, 1024, 'length');
    eq(back.every((v, i) => v === bin[i]), true, 'bytes');
    eq((await w.exec('wc -c < /work/a/b/c.bin')).stdout.trim(), '1024');
    let threw = false;
    try { await w.readFile('/work/nope'); } catch { threw = true; }
    eq(threw, true, 'missing file throws');
  }],
  ['7 pipeline', async () => {
    eq((await w.exec('seq 1 1000 | grep 7 | wc -l')).stdout.trim(), '271');
  }],
  ['8 20KB command', async () => {
    let s = '';
    for (let i = 1; i <= 1000; i++) s += `echo ${i} # ${'p'.repeat(12)}\n`;
    const r = await w.exec(s);
    const lines = r.stdout.trim().split('\n');
    eq(lines.length, 1000, 'lines'); eq(lines[999], '1000'); eq(s.length > 20000, true);
  }],
  ['9 timeout', async () => {
    const r = await w.exec('sleep 5', { timeoutMs: 1000 });
    eq(r.timedOut, true);
    eq((await w.exec('echo ok')).stdout, 'ok\n');
  }],
  ['10 concurrent', async () => {
    const rs = await Promise.all([1, 2, 3, 4, 5].map((i) => w.exec(`echo n${i}; echo e${i} >&2`)));
    rs.forEach((r, i) => { eq(r.stdout, `n${i + 1}\n`); eq(r.stderr, `e${i + 1}\n`); });
  }],
  ['11 maxOutputBytes', async () => {
    const r = await w.exec('seq 1 100000', { maxOutputBytes: 1000 });
    eq(r.truncated, true); eq(r.stdout.length, 1000);
  }],
  ['12 reset', async () => {
    await w.writeFile('/work/x', 'x');
    const t = performance.now();
    await w.reset();
    results.timings.resetMs = performance.now() - t;
    eq((await w.exec('[ -e /work/x ]')).exitCode, 1);
    eq((await w.exec('echo hi')).stdout, 'hi\n');
  }],
  ['13 command substitution', async () => {
    eq((await w.exec('echo $(echo hi) `echo yo`')).stdout, 'hi yo\n');
  }],
  ['14 substitution with pipeline', async () => {
    eq((await w.exec('a=$(seq 3 | wc -l); echo $a')).stdout, '3\n');
  }],
  ['15 find -exec', async () => {
    const r = await w.exec("mkdir -p d && echo x > d/a.txt && echo y > d/b.txt && find d -name '*.txt' -exec cat {} \\; | sort");
    eq(r.stdout, 'x\ny\n'); eq(r.exitCode, 0);
  }],
  ['16 xargs', async () => {
    eq((await w.exec("printf 'a\\nb\\n' | xargs -n1 echo L")).stdout, 'L a\nL b\n');
  }],
  ['17 tar czf/xzf', async () => {
    const r = await w.exec('tar czf t.tgz d && rm -r d && tar xzf t.tgz && cat d/a.txt');
    eq(r.stdout, 'x\n'); eq(r.exitCode, 0);
  }],
  ['18 timeout applet', async () => {
    const r = await w.exec('timeout 1 sleep 5; echo $?');
    eq(/(^|\n)[1-9][0-9]*\n$/.test(r.stdout), true, 'stdout ' + JSON.stringify(r.stdout));
    results.timings.timeoutAppletExit = r.stdout.trim().split('\n').pop();
    eq(r.durationMs < 4000, true, 'duration ' + r.durationMs);
  }],
  ['19 exec timeout keeps fs', async () => {
    await w.writeFile('/work/keep', 'k');
    const r = await w.exec('sleep 5', { timeoutMs: 1500 });
    eq(r.timedOut, true); eq(r.exitCode, 137);
    eq((await w.exec('cat /work/keep')).stdout, 'k');
  }],
  ['20 recursion', async () => {
    eq((await w.exec('f(){ [ $1 -gt 0 ] && f $(($1-1)); echo -n .; }; f 200 | wc -c')).stdout.trim(), '201');
  }],
  ['21 sh -c exit code', async () => {
    eq((await w.exec("sh -c 'exit 7'; echo $?")).stdout, '7\n');
  }],
  ['22 qjs -e', async () => {
    eq((await w.exec(`qjs -e 'console.log(1+2)'`)).stdout, '3\n');
  }],
  ['23 qjs modern JS', async () => {
    await w.writeFile('/work/a.js', [
      'class A { #x = 2; get x() { return this.#x; } static make() { return new A(); } }',
      'const m = new Map([["a", 1], ["b", 2]]);',
      'async function f() { await null; return [...m.values()].reduce((s, v) => s + v, 0); }',
      'const big = 2n ** 64n;',
      'async function main() { console.log(`${A.make().x}-${await f()}-${big}-${JSON.stringify({ k: [1, "x"], m: [...m] })}`); }',
      'main();',
      '',
    ].join('\n'));
    const r = await w.exec('qjs /work/a.js');
    eq(r.stderr, ''); eq(r.stdout, '2-3-18446744073709551616-{"k":[1,"x"],"m":[["a",1],["b",2]]}\n');
  }],
  ['24 qjs ES module import', async () => {
    await w.writeFile('/work/lib.js', 'export const k = 42;\n');
    await w.writeFile('/work/m.js', "import {k} from './lib.js'; console.log(k);\n");
    const r = await w.exec('qjs --module /work/m.js');
    eq(r.stdout, '42\n'); eq(r.stderr, '');
  }],
  ['25 qjs std/os', async () => {
    await w.writeFile('/work/s.js', [
      "import * as std from 'std'; import * as os from 'os';",
      "const f = std.open('/work/out.txt', 'w'); f.puts('hello std\\n'); f.close();",
      "console.log(std.loadFile('/work/out.txt').trim());",
      "os.setTimeout(() => console.log('t'), 10);",
      '',
    ].join('\n'));
    const r = await w.exec('qjs --module /work/s.js');
    eq(r.stdout, 'hello std\nt\n'); eq(r.stderr, '');
  }],
  ['26 qjs uncaught error', async () => {
    const r = await w.exec(`qjs -e 'throw new Error("boom")'`);
    eq(r.exitCode !== 0, true, 'exit ' + r.exitCode);
    eq(r.stderr.includes('boom'), true, 'stderr ' + JSON.stringify(r.stderr));
  }],
  ['27 qjs deep recursion', async () => {
    const r = await w.exec(`qjs -e 'function f(n){return f(n+1)} try{f(0)}catch(e){console.log(e.constructor.name)}'`);
    eq(r.stdout, 'RangeError\n');
    eq((await w.exec('echo ok')).stdout, 'ok\n');
  }],
  ['28 qjs os.exec', async () => {
    const r = await w.exec(`qjs --std -e 'os.exec(["echo","hi"])'`);
    eq(r.stdout, 'hi\n'); eq(r.exitCode, 0);
  }],
  ['29 qjs 50 MB allocation', async () => {
    const r = await w.exec(`qjs -e 'const a=new Uint8Array(50e6); a[a.length-1]=7; console.log(a[a.length-1])'`);
    eq(r.stdout, '7\n');
  }],
  ['30 qjs fib(27) timing (report only)', async () => {
    const src = 'function fib(n){return n<2?n:fib(n-1)+fib(n-2)} const t=Date.now(); const r=fib(27); console.log(r, Date.now()-t);';
    await w.writeFile('/work/fib.js', src + '\n');
    const r = await w.exec('qjs /work/fib.js');
    const [val, ms] = r.stdout.trim().split(' ').map(Number);
    eq(val, 196418);
    results.timings.qjsFib27Ms = ms;
    const hostFib = (n) => (n < 2 ? n : hostFib(n - 1) + hostFib(n - 2));
    const t = performance.now();
    hostFib(27);
    results.timings.hostFib27Ms = performance.now() - t;
  }],
  ['31 30x exec exit code loop', async () => {
    for (let i = 0; i < 30; i++) {
      const r = await w.exec("sh -c 'exit 7'; echo $?");
      eq(r.stdout, '7\n', 'iteration ' + i);
    }
  }],
  ['32 10x readFile of 64 KB random file', async () => {
    const data = new Uint8Array(64 * 1024);
    crypto.getRandomValues(data.subarray(0, 65536));
    await w.writeFile('/work/r64k.bin', data);
    for (let i = 0; i < 10; i++) {
      const back = await w.readFile('/work/r64k.bin');
      eq(back.length, data.length, 'length ' + i);
      eq(back.every((v, j) => v === data[j]), true, 'bytes ' + i);
    }
  }],
  ['33 curl GET', async () => {
    const r = await w.exec(`curl -s ${location.origin}/machine.html`);
    eq(r.exitCode, 0, 'exit, stderr ' + r.stderr);
    eq(r.stdout.includes('linux.js'), true, 'body ' + r.stdout.slice(0, 80));
  }],
  ['34 curl -o -w, -f on 404', async () => {
    const r = await w.exec(`curl -s -o page.html -w '%{http_code}' ${location.origin}/machine.html && grep -q linux.js page.html && echo ' ok'`);
    eq(r.stdout, '200 ok\n');
    eq((await w.exec(`curl -sf ${location.origin}/nope`)).exitCode, 22);
  }],
  ['35 curl -i and POST body', async () => {
    const r = await w.exec(`curl -si -X POST -d a=1 ${location.origin}/machine.html | head -n 1`);
    eq(/^HTTP\/1\.1 \d{3} /.test(r.stdout), true, 'status line ' + JSON.stringify(r.stdout));
  }],
  ['36 apt-get install sqlite, file database', async () => {
    const r = await w.exec('apt-get install -y sqlite', { timeoutMs: 60000 });
    eq(r.exitCode, 0, 'exit, stderr ' + r.stderr);
    await w.exec(`sqlite3 /work/t.db "create table t(x); insert into t values (1),(2),(3);"`);
    const q = await w.exec(`sqlite3 /work/t.db "select sum(x) from t;"`);
    eq(q.stdout, '6\n', 'sqlite ' + q.stderr);
    eq((await w.exec('apt list --installed')).stdout, 'sqlite/winix 3.47.2 wasm32 [installed]\n');
  }],
  ['36b lua (setjmp/longjmp)', async () => {
    eq((await w.exec('apt-get install -y lua', { timeoutMs: 60000 })).exitCode, 0);
    eq((await w.exec(`lua -e 'print(("ok"):rep(2), 2^10)'`)).stdout, 'okok\t1024.0\n');
    eq((await w.exec(`lua -e 'print(pcall(error, "boom"))'`)).stdout, 'false\tboom\n');
    const r = await w.exec(`lua -e 'error("bad")'`);
    eq(r.exitCode, 1); eq(r.stderr.includes('bad'), true, 'stderr ' + r.stderr);
  }],
  ['37 apt unknown package, remove', async () => {
    const r = await w.exec('apt install -y nope');
    eq(r.exitCode, 100);
    eq(r.stderr.includes('E: Unable to locate package nope'), true, 'stderr ' + r.stderr);
    await w.exec('apt remove -y sqlite');
    eq((await w.exec('command -v sqlite3 || echo gone')).stdout, 'gone\n');
  }],
  ['38 blink runs x86-64 code', async () => {
    eq((await w.exec('apt-get install -y blink', { timeoutMs: 60000 })).exitCode, 0);
    const msg = [...new TextEncoder().encode('hi from x86-64\n')];
    // write(1, msg, len); exit(0)
    const code = [0xb8, 1, 0, 0, 0, 0xbf, 1, 0, 0, 0, 0x48, 0x8d, 0x35, 16, 0, 0, 0, 0xba, msg.length, 0, 0, 0,
      0x0f, 0x05, 0xb8, 60, 0, 0, 0, 0x31, 0xff, 0x0f, 0x05, ...msg];
    await w.writeFile('/work/hello.x86', x86Elf(code), { mode: 0o755 });
    const r = await w.exec('blink /work/hello.x86');
    eq(r.stdout, 'hi from x86-64\n', 'stderr ' + r.stderr); eq(r.exitCode, 0);
  }],
  ['39 blink snapshot fork + wait4', async () => {
    // fork(); child: exit(7); parent: wait4(-1, &st, 0, 0); exit(WEXITSTATUS(st))
    const code = [0xb8, 57, 0, 0, 0, 0x0f, 0x05, 0x85, 0xc0, 0x75, 12, 0xbf, 7, 0, 0, 0, 0xb8, 60, 0, 0, 0, 0x0f, 0x05,
      0x48, 0x83, 0xec, 0x10, 0xbf, 0xff, 0xff, 0xff, 0xff, 0x48, 0x89, 0xe6, 0x31, 0xd2, 0x45, 0x31, 0xd2,
      0xb8, 61, 0, 0, 0, 0x0f, 0x05, 0x8b, 0x04, 0x24, 0xc1, 0xe8, 0x08, 0x89, 0xc7, 0xb8, 60, 0, 0, 0, 0x0f, 0x05];
    await w.writeFile('/work/fork.x86', x86Elf(code), { mode: 0o755 });
    const r = await w.exec('blink /work/fork.x86', { timeoutMs: 20000 });
    eq(r.exitCode, 7, 'stderr ' + r.stderr);
  }],
];

/// A minimal static x86-64 ELF: one R+X segment at 0x400000 holding `code`, entry at its start.
function x86Elf(code) {
  const hdr = 64 + 56, u = new Uint8Array(hdr + code.length), b = new DataView(u.buffer);
  u.set([0x7f, 0x45, 0x4c, 0x46, 2, 1, 1, 0]);
  b.setUint16(16, 2, true); b.setUint16(18, 62, true); b.setUint32(20, 1, true);
  b.setBigUint64(24, BigInt(0x400000 + hdr), true); b.setBigUint64(32, 64n, true);
  b.setUint16(52, 64, true); b.setUint16(54, 56, true); b.setUint16(56, 1, true);
  b.setUint32(64, 1, true); b.setUint32(68, 5, true);
  b.setBigUint64(80, 0x400000n, true); b.setBigUint64(88, 0x400000n, true);
  b.setBigUint64(96, BigInt(u.length), true); b.setBigUint64(104, BigInt(u.length), true); b.setBigUint64(112, 0x1000n, true);
  u.set(code, hdr);
  return u;
}

for (const [name, fn] of cases) {
  const t = performance.now();
  try { await fn(); results.cases.push({ name, pass: true, ms: performance.now() - t }); log('PASS ' + name); }
  catch (e) { results.cases.push({ name, pass: false, error: String(e.message || e), ms: performance.now() - t }); log('FAIL ' + name + ': ' + e.message); }
}

try {
  const lat = [];
  for (let i = 0; i < 10; i++) { const r = await w.exec('true'); lat.push(r.durationMs); }
  results.timings.execTrueMedianMs = med(lat);
  const big = new Uint8Array(200 * 1024);
  crypto.getRandomValues(big.subarray(0, 65536));
  for (let i = 65536; i < big.length; i += 65536) big.copyWithin(i, 0, Math.min(65536, big.length - i));
  let t = performance.now();
  await w.writeFile('/work/big.bin', big);
  results.timings.writeFile200KBMs = performance.now() - t;
  t = performance.now();
  const back = await w.readFile('/work/big.bin');
  results.timings.readFile200KBMs = performance.now() - t;
  results.timings.throughputOk = back.length === big.length && back.every((v, i) => v === big[i]);
} catch (e) { results.timings.error = String(e.message || e); }

w.dispose();
window.__done = true;
</script>
